[package]
name = "zed-text-editor"
version = "0.1.0"
edition = "2021"

[lib]
name = "zed_text_editor"
path = "src/lib.rs"

[[bin]]
name = "zed-text-editor"
path = "src/main.rs"

[[bin]]
name = "tui"
path = "src/bin/tui.rs"

[[bin]]
name = "gui"
path = "src/bin/gui.rs"

[dependencies]
# TUI dependencies
ratatui = "0.28"
crossterm = "0.28"
dirs = "5.0"
flate2 = "1.0"
bytes = "1.6"

# GUI dependencies
eframe = "0.29"
egui = "0.29"
rfd = "0.15"    # Native file dialogs
memmap2 = "0.9"

serde = { version = "1.0", features = ["derive"] }
regex = "1.10"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-highlight = "0.22"

# AI & Networking
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1.37", features = ["full"] }
serde_json = "1.0"
futures-util = "0.3"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"

[[bench]]
name = "rope_bench"
harness = false
